services:
  - type: web
    name: gpi-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: GPI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: FRONTEND_URL
        value: https://gpi-umber.vercel.app
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: gpi-database
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: ADMIN_EMAIL
        value: admin@gpi.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOM
        value: Admin
      - key: ADMIN_PRENOM
        value: GPI
      - key: CHATBOT_DRIVER
        value: anthropic
      - key: CHATBOT_ANTHROPIC_API_KEY
        sync: false
      - key: CHATBOT_ANTHROPIC_MODEL
        value: claude-sonnet-4-5

databases:
  - name: gpi-database
    plan: free
